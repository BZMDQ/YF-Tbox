name: Build and publish YF-Tbox manual package

on:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'requirements-build.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yf-tbox-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Python 3.8 x86
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.8.10'
          architecture: 'x86'

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          & '${{ steps.python.outputs.python-path }}' -m pip install --disable-pip-version-check -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python build dependency installation failed.' }

      - name: Read version
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath 'Source/local_tcp_gui.py' -Raw -Encoding UTF8
          $match = [regex]::Match($source, "(?m)^APP_VERSION\s*=\s*'([^']+)'\s*$")
          if (-not $match.Success) { throw 'Cannot read APP_VERSION from local_tcp_gui.py.' }
          $version = $match.Groups[1].Value
          $tag = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Windows x86 application files
        id: build
        shell: pwsh
        env:
          TOOLBOX_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'yf-tbox-build'
          New-Item -ItemType Directory -Path $build -Force | Out-Null
          $exe = Join-Path $build "ResearchToolbox_${{ steps.metadata.outputs.version }}.exe"
          $buildScript = Join-Path $env:GITHUB_WORKSPACE 'Source\build.ps1'
          & $buildScript -OneDir -OutputPath $exe -WorkPath (Join-Path $build 'work')
          if ($LASTEXITCODE -ne 0) { throw 'Portable application build failed.' }
          $app = Join-Path $build "ResearchToolbox_${{ steps.metadata.outputs.version }}"
          if (-not (Test-Path -LiteralPath (Join-Path $app (Split-Path -Leaf $exe)) -PathType Leaf)) {
            throw 'PyInstaller output is incomplete.'
          }

          # 手动覆盖包只包含工具箱应用运行文件，不会由工具箱联网自动下载或安装。
          $manualRoot = Join-Path $build "研发工具箱_${{ steps.metadata.outputs.version }}_Manual_Overlay"
          New-Item -ItemType Directory -Path $manualRoot -Force | Out-Null
          Get-ChildItem -LiteralPath $app -Force | Copy-Item -Destination $manualRoot -Recurse -Force
          '请先退出工具箱，再将本目录内容手动覆盖到已有工具箱安装目录。该包不含 CubeProgrammer、ST-LINK 驱动、许可证或用户配置；首次安装请使用完整安装程序。' | Set-Content -LiteralPath (Join-Path $manualRoot '手动更新说明.txt') -Encoding UTF8
          $archive = Join-Path $build "研发工具箱_${{ steps.metadata.outputs.version }}_Manual_Overlay.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($manualRoot, $archive, [IO.Compression.CompressionLevel]::Optimal, $true)
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Set-Content -LiteralPath ($archive + '.sha256') -Encoding ASCII
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: 研发工具箱 ${{ steps.metadata.outputs.version }}
          body: Windows x86 手动覆盖包。工具箱界面不提供自动更新；请退出工具箱后手动覆盖应用文件。首次安装请使用完整安装程序。
          files: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.archive }}.sha256
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
