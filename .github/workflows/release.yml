name: Build and publish YF-Tbox manual installer

on:
  push:
    branches: [main]
    paths: ['Source/**', 'requirements-build.txt', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yf-tbox-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.8.10'
          architecture: 'x86'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
      - name: Check connections, D133 USB window negotiation, and cancellation
        shell: pwsh
        working-directory: Source
        run: |
          python -m unittest test_connection_transport test_gui_connection_policy test_ota_window1 test_boot_update test_d133_proxy test_wireless_page -v
          if ($LASTEXITCODE -ne 0) { throw 'Connection or transfer checks failed.' }
      - name: Build and check application
        id: build
        shell: pwsh
        env:
          TOOLBOX_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content Source/local_tcp_gui.py -Raw -Encoding UTF8
          $version = [regex]::Match($text, "(?m)^APP_VERSION\s*=\s*'([^']+)'").Groups[1].Value
          if (-not $version) { throw 'Missing version.' }
          $build = Join-Path $env:RUNNER_TEMP 'yf-tbox'
          $exe = Join-Path $build "ResearchToolbox_$version.exe"
          & ./Source/build.ps1 -OneDir -OutputPath $exe -WorkPath (Join-Path $build 'work')
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed.' }
          $app = Join-Path $build "ResearchToolbox_$version"
          $report = Join-Path $build 'startup-check.json'
          $process = Start-Process (Join-Path $app "ResearchToolbox_$version.exe") -ArgumentList @('--startup-check', $report) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) { throw 'Startup check timed out.' }
          if (-not (Test-Path $report)) { throw 'Startup check did not produce a report.' }
          $startup = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $startup.ok -or -not $startup.wireless_modes_checked) { throw 'Startup check failed.' }
          $sourceOut = Join-Path $app 'Source'
          New-Item -ItemType Directory -Path $sourceOut -Force | Out-Null
          Get-ChildItem Source -File | Copy-Item -Destination $sourceOut
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app=$app" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "output=$(Join-Path $build "ResearchToolbox_${version}_Setup.exe")" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build native manual installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $nsis)) { choco install nsis --no-progress -y }
          if (-not (Test-Path $nsis)) { throw 'NSIS is unavailable.' }
          & $nsis /INPUTCHARSET UTF8 "/DAPP_VERSION=${{ steps.build.outputs.version }}" "/DPAYLOAD_DIR=${{ steps.build.outputs.app }}" "/DOUTPUT_FILE=${{ steps.build.outputs.output }}" Source/manual_installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $hash = (Get-FileHash '${{ steps.build.outputs.output }}' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ResearchToolbox_${{ steps.build.outputs.version }}_Setup.exe" | Set-Content '${{ steps.build.outputs.output }}.sha256' -Encoding ASCII
      - name: Publish manual download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 研发工具箱 ${{ steps.build.outputs.version }}
          body: |
            手动下载安装程序，安装完整工具箱应用运行文件及源码，不生成额外 ZIP。
            保留既有 CubeProgrammer、ST-LINK 驱动和用户配置；此公共包不分发厂商工具。
            0.8.54 从“03 无线烧录”进入 D133 USB A/B。F750 1.4.54 与 D133 1.0.171 协商后支持 32 KiB、窗口 2，每个逻辑块拆成最多两帧并逐块核对累计确认。仅支持大块的组合使用 32 KiB、窗口 1，其他兼容组合使用 4 KiB、窗口 1。最低兼容版本为 F750 1.4.49 与 D133 1.0.169。D133 1.0.170 起支持电脑端确认，旧版 D133 按屏幕提示确认。D133 校验签名并更新非活动槽，重启后核对版本、目标槽和健康确认。
            W78 / PIC24 HEX 从“03 无线烧录”进入，D133 TCP 直连从“04 固件升级”进入。
            已完成主机连接策略和打包界面检查；实际开发板与公司网络的速度和长时间稳定性需现场验证。
            工具箱不会自动检查、下载或安装更新。
          files: |
            ${{ steps.build.outputs.output }}
            ${{ steps.build.outputs.output }}.sha256
          fail_on_unmatched_files: true
